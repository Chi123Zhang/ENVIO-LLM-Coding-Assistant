name: ORCCA and ENVIO regression
on:
  pull_request:
  push:
    branches: [feature/orcca-research-audit]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU runtime
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install existing app and audit dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Offline synthetic software regression
        run: python -m pytest -q
